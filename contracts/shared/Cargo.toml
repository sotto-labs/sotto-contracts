# Segment 2b wires this crate into the four contract crates as a path
# dependency. It is now implicitly part of the root workspace via that path
# dependency (Cargo auto-absorbs local path deps of workspace members), so
# it no longer declares its own [workspace] table — doing so conflicts with
# being a dependency of another workspace's member ("multiple workspace
# roots"). See the segment 2b STOP BLOCK.


[package]
name = "sotto-shared"
edition = "2021"
version = "0.1.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
