# This crate is deliberately its own Cargo workspace (see the empty
# [workspace] table below) rather than a member of the root workspace.
# Segment 2 of the scaffold loop is whitelisted to touch contracts/shared/**
# and each contract's types.rs / errors.rs / events.rs, but not the root
# Cargo.toml or the four contract crates' lib.rs files. Self-containing this
# crate lets it build and lint on its own without editing anything outside
# that whitelist. Wiring it into the root workspace and into each contract's
# lib.rs is carried-forward work — see the segment 2 STOP BLOCK.
[workspace]

[package]
name = "sotto-shared"
edition = "2021"
version = "0.1.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
